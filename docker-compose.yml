services:
  db:
    image: postgres:16-alpine
    container_name: psiangel-db
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - psiangel_db_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  psiangel_db_data:
    name: psiangel_db_data